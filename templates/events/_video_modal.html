{% load i18n %}
<dialog class="video-dialog" id="videoDialog" aria-labelledby="videoDialogTitle">
  <div class="video-dialog-shell">
    <button class="video-dialog-close" type="button" data-video-close aria-label="{% translate 'Cerrar video' %}">×</button>
    <div class="video-dialog-frame">
      <iframe
        id="videoDialogFrame"
        title="{% translate 'Reproductor de YouTube' %}"
        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
        allowfullscreen
      ></iframe>
    </div>
    <div class="video-dialog-caption">
      <p>{% translate "Eventos" %} · Noches Sobrenaturales</p>
      <h2 id="videoDialogTitle">{% translate "Video del encuentro" %}</h2>
    </div>
  </div>
</dialog>
