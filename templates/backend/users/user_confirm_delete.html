{% extends 'backend/backend.html' %}

{% block title %}Eliminar usuario{% endblock %}

{% block content %}
  <section class="dashboard-confirm">
    <p class="dashboard-eyebrow">Acción permanente</p>
    <span class="dashboard-confirm-icon" aria-hidden="true">×</span>
    <h1>¿Eliminar a “{{ account.username }}”?</h1>
    <p>La persona perderá inmediatamente el acceso y la cuenta no podrá recuperarse.</p>
    <form method="post">
      {% csrf_token %}
      <a href="{% url 'dashboard:user_list' %}">Cancelar</a>
      <button type="submit">Sí, eliminar cuenta</button>
    </form>
  </section>
{% endblock %}
