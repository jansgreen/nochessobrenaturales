<!doctype html>
<html lang="es">
<body style="margin:0;padding:0;background:#ece6da;font-family:Arial,sans-serif;color:#080a0e">
  <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="background:#ece6da;padding:32px 16px">
    <tr>
      <td align="center">
        <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="max-width:640px;background:#fffdf8;border-collapse:collapse">
          <tr>
            <td style="padding:28px 32px;background:#080a0e;color:#fffdf8">
              <p style="margin:0 0 8px;color:#e7ca82;font-size:11px;letter-spacing:2px;text-transform:uppercase">Nuevo mensaje</p>
              <h1 style="margin:0;font-family:Georgia,serif;font-size:30px;font-weight:400">Noches Sobrenaturales</h1>
            </td>
          </tr>
          <tr>
            <td style="padding:32px">
              <p style="margin:0 0 24px;font-size:20px"><strong>{{ topic }}</strong></p>

              <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="margin-bottom:28px;border-top:1px solid #ded8cc">
                <tr>
                  <td style="padding:12px 0;border-bottom:1px solid #ded8cc;color:#666965;font-size:13px">Nombre</td>
                  <td style="padding:12px 0;border-bottom:1px solid #ded8cc;text-align:right;font-size:13px"><strong>{{ name }}</strong></td>
                </tr>
                <tr>
                  <td style="padding:12px 0;border-bottom:1px solid #ded8cc;color:#666965;font-size:13px">Correo</td>
                  <td style="padding:12px 0;border-bottom:1px solid #ded8cc;text-align:right;font-size:13px"><a href="mailto:{{ email }}" style="color:#228bc5">{{ email }}</a></td>
                </tr>
                <tr>
                  <td style="padding:12px 0;border-bottom:1px solid #ded8cc;color:#666965;font-size:13px">Fecha</td>
                  <td style="padding:12px 0;border-bottom:1px solid #ded8cc;text-align:right;font-size:13px">{{ submitted_at|date:"d/m/Y H:i T" }}</td>
                </tr>
              </table>

              <div style="padding:20px;border-left:3px solid #c9a351;background:#f6f2e9;font-size:15px;line-height:1.7">
                {{ message|linebreaksbr }}
              </div>

              <p style="margin:24px 0 0;color:#666965;font-size:12px">Responde directamente a este correo para escribirle a {{ name }}.</p>
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
